name: Mar O Pele Padshahi - Unity Android Auto WF2

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '*.zip'
      - '.github/workflows/mar-o-pele-padshahi-unity-build-auto-wf2.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: mar-o-pele-padshahi-unity-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: unity-project
  RELEASE_DIR: release
  DIAGNOSTICS_DIR: failure-logs
  SOURCE_GLOB: '*.zip'

jobs:
  android:
    name: Validate, test and build Bazaar/Myket APKs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Initialize CI directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR" "$RELEASE_DIR" "$DIAGNOSTICS_DIR" _source .ci TestResults
          mkdir -p .ci "$DIAGNOSTICS_DIR"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "runner_os=$RUNNER_OS"
            echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .ci/run-context.txt

      - name: Select latest valid Unity source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          source_zip=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue

            base_name="$(basename "$candidate")"
            case "${base_name,,}" in
              *failure*|*logs*|*artifact*|*license*|*unity_lic*|*keystore*|*release*|*output*)
                continue
                ;;
            esac

            if unzip -Z1 "$candidate" 2>/dev/null \
              | grep -Eq '(^|/)ProjectSettings/ProjectVersion\.txt$'; then
              source_zip="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "$SOURCE_GLOB" \
              -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
          )

          if [ -z "$source_zip" ] || [ ! -f "$source_zip" ]; then
            echo "No valid Unity source ZIP was found in the repository root." | tee .ci/source-error.txt >&2
            echo "The ZIP must directly contain a Unity ProjectSettings/ProjectVersion.txt entry." | tee -a .ci/source-error.txt >&2
            exit 1
          fi

          echo "zip=$source_zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$source_zip")" >> "$GITHUB_OUTPUT"
          sha256sum "$source_zip" | tee .ci/source-sha256.txt
          unzip -l "$source_zip" > .ci/source-zip-list.txt

      - name: Extract and normalize Unity project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _source
          unzip -q "${{ steps.source.outputs.zip }}" -d _source

          mapfile -t version_files < <(find _source -type f -path '*/ProjectSettings/ProjectVersion.txt' -print)
          if [ "${#version_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one Unity project, found %s ProjectVersion files.\n' \
              "${#version_files[@]}" | tee .ci/project-error.txt >&2
            printf '%s\n' "${version_files[@]:-}" >> .ci/project-error.txt
            exit 1
          fi

          version_file="${version_files[0]}"
          source_project="$(dirname "$(dirname "$version_file")")"
          mv "$source_project" "$PROJECT_DIR"

          test -d "$PROJECT_DIR/Assets"
          test -f "$PROJECT_DIR/Packages/manifest.json"
          test -f "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"

          unity_version="$(sed -n 's/^m_EditorVersion:[[:space:]]*//p' \
            "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt" | head -n 1 | tr -d '\r')"
          if [ -z "$unity_version" ]; then
            echo "Unity editor version could not be read." | tee .ci/project-error.txt >&2
            exit 1
          fi

          echo "UNITY_VERSION=$unity_version" >> "$GITHUB_ENV"
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "unity_version=$unity_version" >> "$GITHUB_OUTPUT"
          echo "Unity project: $PROJECT_DIR"
          echo "Unity version: $unity_version"


      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/Tools/validate_project.py" 2>&1 | tee .ci/static-validation.log

      - name: Prepare Unity activation
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL_SECRET: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL_SECRET: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_SECRET: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail

          license_file="$GITHUB_WORKSPACE/.ci/UnityLicense.ulf"
          activation_mode=""

          if [ -n "${UNITY_LICENSE_SECRET:-}" ]; then
            # Accept either raw ULF/XML content or a base64-encoded license.
            if printf '%s' "$UNITY_LICENSE_SECRET" | grep -q '<'; then
              printf '%s' "$UNITY_LICENSE_SECRET" > "$license_file"
            elif printf '%s' "$UNITY_LICENSE_SECRET" | base64 --decode > "$license_file" 2>/dev/null \
              && grep -q '<' "$license_file"; then
              :
            else
              printf '%s' "$UNITY_LICENSE_SECRET" > "$license_file"
            fi
            activation_mode="license-secret"
          elif [ -n "${UNITY_SERIAL_SECRET:-}" ]; then
            activation_mode="serial-secret"
          else
            # Optional automatic fallback: a root ZIP such as Unity_lic.zip
            # may contain one .ulf file. Credentials still remain GitHub Secrets.
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              member="$(unzip -Z1 "$candidate" 2>/dev/null \
                | grep -Ei '(^|/)[^/]+\.ulf$' | head -n 1 || true)"
              if [ -n "$member" ]; then
                unzip -p "$candidate" "$member" > "$license_file"
                activation_mode="license-zip:$(basename "$candidate")"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' \
                -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
            )
          fi

          if [ -z "$activation_mode" ]; then
            {
              echo "Unity activation data is missing."
              echo "Add UNITY_LICENSE, or UNITY_SERIAL, to GitHub Actions Secrets."
              echo "UNITY_EMAIL and UNITY_PASSWORD are also required by GameCI activation."
            } | tee .ci/activation-error.txt >&2
            exit 1
          fi

          if [ -z "${UNITY_EMAIL_SECRET:-}" ] || [ -z "${UNITY_PASSWORD_SECRET:-}" ]; then
            {
              echo "UNITY_EMAIL or UNITY_PASSWORD is missing from GitHub Actions Secrets."
              echo "Activation mode detected: $activation_mode"
            } | tee .ci/activation-error.txt >&2
            exit 1
          fi

          echo "::add-mask::$UNITY_EMAIL_SECRET"
          echo "::add-mask::$UNITY_PASSWORD_SECRET"
          [ -z "${UNITY_SERIAL_SECRET:-}" ] || echo "::add-mask::$UNITY_SERIAL_SECRET"

          if [ -f "$license_file" ]; then
            {
              echo 'UNITY_LICENSE_RUNTIME<<__UNITY_LICENSE_EOF__'
              cat "$license_file"
              echo
              echo '__UNITY_LICENSE_EOF__'
            } >> "$GITHUB_ENV"
          fi

          echo "UNITY_EMAIL_RUNTIME=$UNITY_EMAIL_SECRET" >> "$GITHUB_ENV"
          echo "UNITY_PASSWORD_RUNTIME=$UNITY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "UNITY_SERIAL_RUNTIME=${UNITY_SERIAL_SECRET:-}" >> "$GITHUB_ENV"
          echo "activation_mode=$activation_mode" > .ci/activation-status.txt

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME_SECRET: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS_SECRET: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/.ci"
          keystore_host="$GITHUB_WORKSPACE/$PROJECT_DIR/.ci/menchino-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_host"
          else
            # Optional fallback: extract a .jks/.keystore from a root ZIP.
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              member="$(unzip -Z1 "$candidate" 2>/dev/null \
                | grep -Ei '(^|/)[^/]+\.(jks|keystore)$' | head -n 1 || true)"
              if [ -n "$member" ]; then
                unzip -p "$candidate" "$member" > "$keystore_host"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' \
                -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
            )
          fi

          if [ -s "$keystore_host" ]; then
            chmod 600 "$keystore_host"
            signing_mode="release"
            echo "ANDROID_KEYSTORE_PATH_RUNTIME=/github/workspace/$PROJECT_DIR/.ci/menchino-release.jks" >> "$GITHUB_ENV"
          else
            rm -f "$keystore_host"
            signing_mode="development"
            echo "ANDROID_KEYSTORE_PATH_RUNTIME=" >> "$GITHUB_ENV"
          fi

          echo "ANDROID_SIGNING_MODE=$signing_mode" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASS_RUNTIME=${ANDROID_KEYSTORE_PASS_SECRET:-}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYALIAS_NAME_RUNTIME=${ANDROID_KEYALIAS_NAME_SECRET:-}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYALIAS_PASS_RUNTIME=${ANDROID_KEYALIAS_PASS_SECRET:-}" >> "$GITHUB_ENV"
          echo "signing_mode=$signing_mode" > .ci/signing-status.txt

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: unity-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('unity-project/Packages/manifest.json', 'unity-project/Assets/**/*.cs', 'unity-project/Assets/**/*.asmdef') }}
          restore-keys: |
            unity-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Unity EditMode tests
        id: unity_tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE_RUNTIME }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL_RUNTIME }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL_RUNTIME }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD_RUNTIME }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: TestResults
          customParameters: -logFile /github/workspace/${{ env.PROJECT_DIR }}/Logs/EditModeTests.log

      - name: Build Cafe Bazaar APK
        id: build_bazaar
        if: steps.unity_tests.outcome == 'success'
        continue-on-error: true
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE_RUNTIME }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL_RUNTIME }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL_RUNTIME }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD_RUNTIME }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH_RUNTIME }}
          ANDROID_KEYSTORE_PASS: ${{ env.ANDROID_KEYSTORE_PASS_RUNTIME }}
          ANDROID_KEYALIAS_NAME: ${{ env.ANDROID_KEYALIAS_NAME_RUNTIME }}
          ANDROID_KEYALIAS_PASS: ${{ env.ANDROID_KEYALIAS_PASS_RUNTIME }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Menchino.RoyalSnakesLadders.Editor.AndroidBuild.BuildApkBatch
          customParameters: >-
            -storeTarget Bazaar
            -outputPath /github/workspace/${{ env.PROJECT_DIR }}/Builds/Android/MarOPelePadshahi-Bazaar.apk
            -logFile /github/workspace/${{ env.PROJECT_DIR }}/Logs/BazaarBuild.log

      - name: Build Myket APK
        id: build_myket
        if: steps.unity_tests.outcome == 'success'
        continue-on-error: true
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE_RUNTIME }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL_RUNTIME }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL_RUNTIME }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD_RUNTIME }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH_RUNTIME }}
          ANDROID_KEYSTORE_PASS: ${{ env.ANDROID_KEYSTORE_PASS_RUNTIME }}
          ANDROID_KEYALIAS_NAME: ${{ env.ANDROID_KEYALIAS_NAME_RUNTIME }}
          ANDROID_KEYALIAS_PASS: ${{ env.ANDROID_KEYALIAS_PASS_RUNTIME }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Menchino.RoyalSnakesLadders.Editor.AndroidBuild.BuildApkBatch
          customParameters: >-
            -storeTarget Myket
            -outputPath /github/workspace/${{ env.PROJECT_DIR }}/Builds/Android/MarOPelePadshahi-Myket.apk
            -logFile /github/workspace/${{ env.PROJECT_DIR }}/Logs/MyketBuild.log

      - name: Verify Unity stages and APK outputs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "unity_version=${UNITY_VERSION:-unknown}"
            echo "tests=${{ steps.unity_tests.outcome }}"
            echo "bazaar=${{ steps.build_bazaar.outcome }}"
            echo "myket=${{ steps.build_myket.outcome }}"
          } | tee .ci/stage-outcomes.txt

          if [ "${{ steps.unity_tests.outcome }}" != "success" ]; then
            echo "Unity EditMode tests or Unity activation failed." >&2
            exit 1
          fi

          if [ "${{ steps.build_bazaar.outcome }}" != "success" ] \
            || [ "${{ steps.build_myket.outcome }}" != "success" ]; then
            echo "One or both Android builds failed." >&2
            exit 1
          fi

          bazaar="$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Bazaar.apk"
          myket="$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Myket.apk"
          test -s "$bazaar"
          test -s "$myket"

          file "$bazaar" "$myket" | tee .ci/apk-file-types.txt
          sha256sum "$bazaar" "$myket" | tee .ci/apk-sha256.txt

      - name: Collect final outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Bazaar.apk" \
             "$RELEASE_DIR/MarOPelePadshahi-v1.0.0-Bazaar.apk"
          cp "$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Myket.apk" \
             "$RELEASE_DIR/MarOPelePadshahi-v1.0.0-Myket.apk"
          cp "${{ steps.source.outputs.zip }}" \
             "$RELEASE_DIR/${{ steps.source.outputs.name }}"

          cp .ci/static-validation.log "$RELEASE_DIR/" 2>/dev/null || true
          cp .ci/stage-outcomes.txt "$RELEASE_DIR/" 2>/dev/null || true

          (
            cd "$RELEASE_DIR"
            sha256sum *.apk *.zip > SHA256SUMS.txt
          )

          cat > "$RELEASE_DIR/build-info.txt" <<EOF
          project=Mar O Pele Padshahi
          unity=${UNITY_VERSION}
          package=mk.kadkhodai.menchino
          signing=${ANDROID_SIGNING_MODE:-unknown}
          source=${{ steps.source.outputs.name }}
          commit=${GITHUB_SHA}
          run=${GITHUB_RUN_NUMBER}
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Delete artifacts from older successful runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' \
            | while read -r artifact_id; do
                [ -n "$artifact_id" ] || continue
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
              done

      - name: Upload final source and APKs
        uses: actions/upload-artifact@v4
        with:
          name: MarOPelePadshahi-Unity-Android-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Collect complete failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAGNOSTICS_DIR"

          cp -r .ci "$DIAGNOSTICS_DIR/ci" 2>/dev/null || true
          cp -r TestResults "$DIAGNOSTICS_DIR/TestResults" 2>/dev/null || true
          cp -r "$PROJECT_DIR/Logs" "$DIAGNOSTICS_DIR/UnityLogs" 2>/dev/null || true
          cp -r "$PROJECT_DIR/Builds" "$DIAGNOSTICS_DIR/PartialBuilds" 2>/dev/null || true
          cp "$HOME/.local/share/unity3d/Editor.log" \
             "$DIAGNOSTICS_DIR/Editor-local-share.log" 2>/dev/null || true
          cp "$HOME/.config/unity3d/Editor.log" \
             "$DIAGNOSTICS_DIR/Editor-config.log" 2>/dev/null || true
          cp "${{ steps.source.outputs.zip }}" "$DIAGNOSTICS_DIR/" 2>/dev/null || true

          {
            echo "tests=${{ steps.unity_tests.outcome }}"
            echo "bazaar=${{ steps.build_bazaar.outcome }}"
            echo "myket=${{ steps.build_myket.outcome }}"
            echo "unity_version=${UNITY_VERSION:-unknown}"
            echo "source=${{ steps.source.outputs.name }}"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_NUMBER"
          } > "$DIAGNOSTICS_DIR/summary.txt"

          find "$GITHUB_WORKSPACE" -type f \
            \( -name '*.log' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' \) \
            -size -25M -print > "$DIAGNOSTICS_DIR/discovered-files.txt" 2>/dev/null || true

          # Produce a compact, immediately readable error digest.
          grep -RInE \
            'error CS[0-9]+|Compilation failed|BuildFailedException|FAIL|Exception|licen[cs]e|activation|Gradle|IL2CPP|No space left|timed out' \
            "$DIAGNOSTICS_DIR" 2>/dev/null \
            | tail -n 1000 > "$DIAGNOSTICS_DIR/error-digest.txt" || true

          du -ah "$DIAGNOSTICS_DIR" | sort -h > "$DIAGNOSTICS_DIR/file-sizes.txt" 2>/dev/null || true

      - name: Upload complete failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MarOPelePadshahi-failure-logs-${{ github.run_number }}
          path: ${{ env.DIAGNOSTICS_DIR }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          compression-level: 6
