name: Build PULSE ARENA APK - WF7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.zip"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

permissions:
  contents: read
  actions: write

concurrency:
  group: pulse-arena-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.8"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"

jobs:
  build-android:
    name: Build latest Flutter ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostics
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
          OUTPUT_DIR: ${{ runner.temp }}/pulse-arena-output
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUTPUT_DIR"
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "started_at=$(date -u +%FT%TZ)"
          } > "$LOG_DIR/run-info.txt"

      - name: Select and extract newest valid source ZIP
        id: source
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' 2>&1 | tee "$LOG_DIR/select-and-extract.log"
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_base = Path(os.environ["RUNNER_TEMP"]) / "pulse-arena-source"
          output_file = Path(os.environ["GITHUB_OUTPUT"])

          def git_files():
              result = subprocess.run(
                  ["git", "ls-files", "-z", "--", "*.zip"],
                  cwd=workspace,
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return [workspace / p.decode() for p in result.stdout.split(b"\0") if p]

          def commit_time(path: Path) -> int:
              rel = str(path.relative_to(workspace))
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", rel],
                  cwd=workspace,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              value = result.stdout.strip()
              return int(value) if value.isdigit() else int(path.stat().st_mtime)

          def natural_numbers(name: str):
              return tuple(int(x) for x in re.findall(r"\d+", name))

          def valid_project_root(names):
              clean = set()
              for raw in names:
                  raw = raw.replace("\\", "/").lstrip("/")
                  if not raw or raw.endswith("/"):
                      continue
                  parts = PurePosixPath(raw).parts
                  if any(p in ("", ".", "..") for p in parts):
                      continue
                  clean.add("/".join(parts))

              roots = []
              for item in clean:
                  if item == "pubspec.yaml":
                      root = ""
                  elif item.endswith("/pubspec.yaml"):
                      root = item[: -len("/pubspec.yaml")]
                  else:
                      continue
                  prefix = f"{root}/" if root else ""
                  required = {
                      prefix + "lib/main.dart",
                  }
                  gradle_files = {
                      prefix + "android/app/build.gradle",
                      prefix + "android/app/build.gradle.kts",
                  }
                  if required.issubset(clean) and clean.intersection(gradle_files):
                      roots.append(root)
              if not roots:
                  return None
              return sorted(roots, key=lambda r: (r.count("/"), len(r), r))[0]

          rejected_tokens = (
              "failure-log", "failure_log", "diagnostic", "keystore",
              "license", "unity_lic", "apk-output", "aab-output",
          )
          candidates = []
          for path in git_files():
              lower = path.name.lower()
              if any(token in lower for token in rejected_tokens):
                  print(f"REJECT name: {path.relative_to(workspace)}")
                  continue
              try:
                  if not zipfile.is_zipfile(path):
                      print(f"REJECT invalid ZIP: {path.relative_to(workspace)}")
                      continue
                  with zipfile.ZipFile(path) as archive:
                      root = valid_project_root(archive.namelist())
                  if root is None:
                      print(f"REJECT not Flutter Android source: {path.relative_to(workspace)}")
                      continue
                  candidates.append((commit_time(path), natural_numbers(path.name), path.name, path, root))
                  print(f"VALID: {path.relative_to(workspace)} | root={root or '.'}")
              except Exception as error:
                  print(f"REJECT unreadable: {path.relative_to(workspace)} | {error}")

          if not candidates:
              raise SystemExit("ERROR: No valid Flutter Android source ZIP was found in the repository.")

          candidates.sort(key=lambda item: (item[0], item[1], item[2].lower()))
          _, _, _, selected, internal_root = candidates[-1]
          print(f"SELECTED: {selected.relative_to(workspace)}")

          shutil.rmtree(extract_base, ignore_errors=True)
          extract_base.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(selected) as archive:
              for member in archive.infolist():
                  normalized = member.filename.replace("\\", "/").lstrip("/")
                  parts = PurePosixPath(normalized).parts
                  if not normalized or any(part in ("", ".", "..") for part in parts):
                      if normalized:
                          print(f"SKIP unsafe member: {member.filename}")
                      continue
                  destination = (extract_base / Path(*parts)).resolve()
                  if extract_base not in destination.parents and destination != extract_base:
                      raise SystemExit(f"ERROR: Unsafe ZIP member: {member.filename}")
                  if member.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(member) as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)

          project_dir = (extract_base / internal_root).resolve() if internal_root else extract_base.resolve()
          required_paths = [
              project_dir / "pubspec.yaml",
              project_dir / "lib/main.dart",
              project_dir / "android/app",
          ]
          for required in required_paths:
              if not required.exists():
                  raise SystemExit(f"ERROR: Extracted project is incomplete: {required}")

          with output_file.open("a", encoding="utf-8") as handle:
              handle.write(f"zip={selected}\n")
              handle.write(f"dir={project_dir}\n")

          log_dir = Path(os.environ["LOG_DIR"])
          (log_dir / "selected-source.txt").write_text(
              f"zip={selected}\nproject={project_dir}\n", encoding="utf-8"
          )
          print(f"PROJECT_DIR: {project_dir}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Validate project configuration
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' 2>&1 | tee "$LOG_DIR/android-config-validation.log"
          import re
          from pathlib import Path

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          app_file = Path("android/app/build.gradle.kts")
          settings_file = Path("android/settings.gradle.kts")
          if not app_file.is_file() or not settings_file.is_file():
              raise SystemExit("ERROR: Required Kotlin Gradle configuration files are missing.")

          app = app_file.read_text(encoding="utf-8")
          settings = settings_file.read_text(encoding="utf-8")
          game_config = Path("lib/game/config/game_config.dart").read_text(encoding="utf-8")
          ball_controller = Path("lib/game/components/ball_controller.dart").read_text(encoding="utf-8")
          game_screen = Path("lib/screens/game_screen.dart").read_text(encoding="utf-8")
          home_screen = Path("lib/screens/home_screen.dart").read_text(encoding="utf-8")
          hub_screen = Path("lib/screens/hub_screen.dart").read_text(encoding="utf-8")
          app_screen = Path("lib/app/pulse_arena_app.dart").read_text(encoding="utf-8")
          pressable = Path("lib/widgets/neon_pressable.dart").read_text(encoding="utf-8")
          orientation = Path("lib/core/orientation_manager.dart").read_text(encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          performance_test = Path("test/performance_motion_test.dart")
          stage2_test = Path("test/stage2_home_victory_test.dart")
          full_ui_test = Path("test/full_ui_hub_test.dart")

          checks = {
              "app version 1.7.0+12": "version: 1.7.0+12" in pubspec,
              "Bazaar flavor": 'create("bazaar")' in app,
              "Myket flavor": 'create("myket")' in app,
              "release minify disabled": "isMinifyEnabled = false" in app,
              "resource shrinking disabled": "isShrinkResources = false" in app,
              "AGP 8.7.3": 'id("com.android.application") version "8.7.3"' in settings,
              "Kotlin 2.1.0": 'id("org.jetbrains.kotlin.android") version "2.1.0"' in settings,
              "target score is 10": "this.targetScore = 10" in game_config,
              "bounded 120 Hz swept physics": "_physicsStep = 1 / 120" in ball_controller and "iterations < 8" in ball_controller,
              "direct finger-tracking input": all(token in game_screen for token in ("onPointerMove", "onPointerDown", "eventMicros", "onPointerUp")),
              "professional victory overlay": "_VictoryFxPainter" in game_screen and "VICTORY" in game_screen,
              "complete graphical game hub": all(token in hub_screen for token in ("class HubScreen", "class _ProfilePage", "class _MissionsPage", "class _RankingPage", "class _ShopPage", "class _SettingsScreen", "class _LiftedPanelPainter", "class _HomeNavItem", "رتبه‌بندی")) and "HubScreen" in app_screen,
              "compressed press state": "AnimatedScale" in pressable and "pressedScale = 0.96" in pressable,
              "dynamic orientation": "DeviceOrientation.portraitUp" in orientation and "DeviceOrientation.landscapeLeft" in orientation,
              "Android allows runtime orientation": 'android:screenOrientation="unspecified"' in manifest,
              "responsive paddle defaults": all(token in game_config for token in ("this.playerPaddleSpeed = 5200", "this.playerPaddleAcceleration = 85000", "this.botPaddleSpeed = 1080", "this.botReactionDelay = 0.105")),
              "sustained performance guards": all(token in ball_controller for token in ("trailLimit = reducedEffects ? 6 : 10", "_lastImpactAt", "_physicsStep = 1 / 120")),
              "performance regression tests": performance_test.is_file(),
              "stage 2 regression tests": stage2_test.is_file(),
              "full UI hub regression tests": full_ui_test.is_file(),
          }
          failed = [name for name, okay in checks.items() if not okay]
          for name, okay in checks.items():
              print(f"{'OK' if okay else 'FAIL'}: {name}")
          if failed:
              raise SystemExit("ERROR: Invalid project configuration: " + ", ".join(failed))
          PY

      - name: Configure Android SDK and Gradle wrapper
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail

          flutter_bin="$(command -v flutter)"
          flutter_sdk="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" ]]; then
            echo "ERROR: Android SDK path is unavailable." | tee "$LOG_DIR/android-wrapper.log"
            exit 1
          fi

          cat > android/local.properties <<EOF
          sdk.dir=$android_sdk
          flutter.sdk=$flutter_sdk
          EOF

          seed_dir="$(mktemp -d)"
          trap 'rm -rf "$seed_dir"' EXIT
          printf 'rootProject.name = "pulse_wrapper_seed"\n' > "$seed_dir/settings.gradle.kts"

          {
            echo "Generating Gradle ${GRADLE_VERSION} wrapper with setup-gradle."
            (cd "$seed_dir" && gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin \
              --no-daemon)
            mkdir -p android/gradle/wrapper
            cp "$seed_dir/gradlew" android/gradlew
            cp "$seed_dir/gradlew.bat" android/gradlew.bat
            cp "$seed_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp "$seed_dir/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            echo
            echo "Wrapper configuration:"
            cat android/gradle/wrapper/gradle-wrapper.properties
            echo
            (cd android && ./gradlew --version --no-daemon)
          } 2>&1 | tee "$LOG_DIR/android-wrapper.log"

      - name: Configure release signing
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          values=("$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS")
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          rm -f android/key.properties android/app/pulse-arena-release.jks

          if [[ "$present" -eq 0 ]]; then
            echo "No release signing Secrets found; debug signing fallback will be used." \
              | tee "$LOG_DIR/signing.txt"
            exit 0
          fi

          if [[ "$present" -ne 4 ]]; then
            echo "ERROR: Release signing Secrets are incomplete." | tee "$LOG_DIR/signing.txt"
            echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS" \
              | tee -a "$LOG_DIR/signing.txt"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/pulse-arena-release.jks
          keytool -list \
            -keystore android/app/pulse-arena-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=pulse-arena-release.jks
          EOF
          echo "Release keystore restored and validated." | tee "$LOG_DIR/signing.txt"

      - name: Flutter dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          flutter --version 2>&1 | tee "$LOG_DIR/flutter-version.txt"
          dart --version 2>&1 | tee "$LOG_DIR/dart-version.txt"
          java -version 2>&1 | tee "$LOG_DIR/java-version.txt"
          flutter doctor -v > "$LOG_DIR/flutter-doctor.txt" 2>&1 || true
          flutter clean 2>&1 | tee "$LOG_DIR/flutter-clean.log"
          flutter pub get 2>&1 | tee "$LOG_DIR/pub-get.log"

      - name: Static analysis
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$LOG_DIR/analyze.log"

      - name: Tests
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test 2>&1 | tee "$LOG_DIR/test.log"
          else
            echo "No Dart test files were found; test stage skipped." | tee "$LOG_DIR/test.log"
          fi

      - name: Build Bazaar and Myket release APKs
        id: build
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
          OUTPUT_DIR: ${{ runner.temp }}/pulse-arena-output
        run: |
          set -Eeuo pipefail
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          safe_version="$(printf '%s' "$version" | tr '+/' '__' | tr -cd 'A-Za-z0-9._-')"
          mkdir -p "$OUTPUT_DIR"

          build_flavor() {
            local flavor="$1"
            local label="$2"
            local log="$LOG_DIR/build-${flavor}-release.log"
            echo "flutter build apk --release --flavor ${flavor}" | tee -a "$LOG_DIR/pipeline.log"
            if ! flutter build apk --release --flavor "$flavor" 2>&1 | tee "$log"; then
              echo "${label} build failed; collecting verbose diagnostics." | tee -a "$log"
              flutter build apk --release --flavor "$flavor" -v \
                > "$LOG_DIR/build-${flavor}-release-verbose.log" 2>&1 || true
              return 1
            fi

            local apk_path="build/app/outputs/flutter-apk/app-${flavor}-release.apk"
            if [[ ! -f "$apk_path" ]]; then
              apk_path="$(find build/app/outputs -type f -name "*${flavor}*release*.apk" -printf '%T@ %p\n' \
                | sort -n | tail -1 | cut -d' ' -f2-)"
            fi
            if [[ -z "$apk_path" || ! -f "$apk_path" ]]; then
              echo "ERROR: ${label} build finished but its APK was not found." | tee -a "$log"
              return 1
            fi

            local output="$OUTPUT_DIR/PULSE-ARENA-${label}-${safe_version}.apk"
            cp "$apk_path" "$output"
            ls -lh "$output" | tee -a "$LOG_DIR/apk-output.txt"
          }

          build_flavor bazaar Bazaar
          build_flavor myket Myket
          (cd "$OUTPUT_DIR" && sha256sum *.apk > SHA256SUMS.txt)
          cp "$OUTPUT_DIR/SHA256SUMS.txt" "$LOG_DIR/apk-sha256.txt"
          cat "$LOG_DIR/apk-sha256.txt"
          echo "dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Remove previous PULSE ARENA artifacts
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('PULSE-ARENA-')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Bazaar and Myket APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-ARENA-APKS
          path: ${{ steps.build.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
          SELECTED_ZIP: ${{ steps.source.outputs.zip }}
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set +e
          mkdir -p "$LOG_DIR"
          {
            echo "failure_time=$(date -u +%FT%TZ)"
            echo "selected_zip=$SELECTED_ZIP"
            echo "project_dir=$PROJECT_DIR"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          } > "$LOG_DIR/failure-summary.txt"

          flutter --version > "$LOG_DIR/flutter-version-final.txt" 2>&1 || true
          dart --version > "$LOG_DIR/dart-version-final.txt" 2>&1 || true
          java -version > "$LOG_DIR/java-version-final.txt" 2>&1 || true
          gradle --version > "$LOG_DIR/gradle-system-version.txt" 2>&1 || true
          df -h > "$LOG_DIR/disk-space.txt" 2>&1 || true
          free -h > "$LOG_DIR/memory.txt" 2>&1 || true

          if [[ -n "$PROJECT_DIR" && -d "$PROJECT_DIR" ]]; then
            cd "$PROJECT_DIR" || true
            cp pubspec.yaml "$LOG_DIR/pubspec.yaml" 2>/dev/null || true
            cp pubspec.lock "$LOG_DIR/pubspec.lock" 2>/dev/null || true
            cp analysis_options.yaml "$LOG_DIR/analysis_options.yaml" 2>/dev/null || true
            cp android/settings.gradle.kts "$LOG_DIR/settings.gradle.kts" 2>/dev/null || true
            cp android/build.gradle.kts "$LOG_DIR/android-build.gradle.kts" 2>/dev/null || true
            cp android/app/build.gradle.kts "$LOG_DIR/app-build.gradle.kts" 2>/dev/null || true
            cp android/gradle/wrapper/gradle-wrapper.properties "$LOG_DIR/gradle-wrapper.properties" 2>/dev/null || true
            cp android/app/proguard-rules.pro "$LOG_DIR/proguard-rules.pro" 2>/dev/null || true
            find build -type f \( \
              -name 'missing_rules.txt' -o \
              -name 'mapping.txt' -o \
              -name 'usage.txt' -o \
              -name 'seeds.txt' -o \
              -name '*.xml' \
            \) -maxdepth 12 -print 2>/dev/null > "$LOG_DIR/build-diagnostic-files.txt" || true
            while IFS= read -r file; do
              [[ -f "$file" ]] || continue
              target="$LOG_DIR/build-files/${file#./}"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target" 2>/dev/null || true
            done < "$LOG_DIR/build-diagnostic-files.txt"
            find . -maxdepth 5 -type f -printf '%p %s bytes\n' \
              | sort > "$LOG_DIR/project-files.txt" 2>/dev/null || true
          fi

          find "$LOG_DIR" -type f -printf '%P %s bytes\n' \
            | sort > "$LOG_DIR/log-manifest.txt" 2>/dev/null || true

      - name: Remove previous failure-log artifacts
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('PULSE-ARENA-failure-logs-')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-ARENA-failure-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/pulse-arena-logs
          if-no-files-found: warn
          retention-days: 14
