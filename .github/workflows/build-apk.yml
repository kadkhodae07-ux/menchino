name: Build PULSE ARENA APK (Final)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.zip"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pulse-arena-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG_DIR: ${{ github.workspace }}/pulse-arena-failure-logs
  OUTPUT_DIR: ${{ github.workspace }}/pulse-arena-output

jobs:
  build-android:
    name: Validate and build latest ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostics
        run: |
          set -Eeuo pipefail
          rm -rf "$LOG_DIR" "$OUTPUT_DIR"
          mkdir -p "$LOG_DIR" "$OUTPUT_DIR"
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
          } > "$LOG_DIR/run-info.txt"

      - name: Select and extract latest source ZIP
        id: source
        env:
          EXTRACT_DIR: ${{ runner.temp }}/pulse-arena-source
        run: |
          set -Eeuo pipefail
          python3 -u <<'PY' 2>&1 | tee "$LOG_DIR/select-and-extract.log"
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_dir = Path(os.environ["EXTRACT_DIR"]).resolve()
          output_file = Path(os.environ["GITHUB_OUTPUT"])

          ignored_parts = {
              ".git",
              ".dart_tool",
              "build",
              "pulse-arena-output",
              "pulse-arena-failure-logs",
          }

          candidates = []
          for path in repository.rglob("*.zip"):
              relative = path.relative_to(repository)
              if any(part in ignored_parts for part in relative.parts):
                  continue
              lower_name = path.name.lower()
              if "failure-log" in lower_name or "diagnostic" in lower_name:
                  continue
              candidates.append(path)

          if not candidates:
              raise SystemExit("ERROR: No source ZIP file was found in the repository.")

          def git_timestamp(path: Path) -> int:
              relative = str(path.relative_to(repository))
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", relative],
                  cwd=repository,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              value = result.stdout.strip()
              return int(value) if value.isdigit() else 0

          def natural_version_key(name: str):
              return tuple(
                  (0, int(part)) if part.isdigit() else (1, part.lower())
                  for part in re.split(r"(\d+)", name)
              )

          ranked = []
          for path in candidates:
              commit_time = git_timestamp(path)
              modified_time = int(path.stat().st_mtime)
              rank = (commit_time, natural_version_key(path.name), modified_time)
              ranked.append((rank, path))
              print(
                  f"Candidate: {path.relative_to(repository)} | "
                  f"git_time={commit_time} | mtime={modified_time}"
              )

          ranked.sort(key=lambda item: item[0])
          selected = ranked[-1][1]
          print(f"Selected latest ZIP: {selected.relative_to(repository)}")

          with zipfile.ZipFile(selected) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"ERROR: ZIP integrity test failed at: {bad_member}")

              if extract_dir.exists():
                  shutil.rmtree(extract_dir)
              extract_dir.mkdir(parents=True)

              destination_root = extract_dir.resolve()
              for info in archive.infolist():
                  member = Path(info.filename)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"ERROR: Unsafe ZIP entry detected: {info.filename}")

                  unix_mode = info.external_attr >> 16
                  if stat.S_ISLNK(unix_mode):
                      raise SystemExit(f"ERROR: Symbolic links are not allowed in source ZIP: {info.filename}")

                  destination = (destination_root / member).resolve()
                  try:
                      destination.relative_to(destination_root)
                  except ValueError as exc:
                      raise SystemExit(f"ERROR: ZIP path traversal detected: {info.filename}") from exc

              archive.extractall(destination_root)

          pubspecs = []
          for pubspec in extract_dir.rglob("pubspec.yaml"):
              if any(part in {".dart_tool", "build"} for part in pubspec.parts):
                  continue
              root = pubspec.parent
              if (root / "lib" / "main.dart").is_file() and (root / "android").is_dir():
                  pubspecs.append(pubspec)

          if not pubspecs:
              raise SystemExit(
                  "ERROR: The selected ZIP does not contain a valid Flutter Android project "
                  "with pubspec.yaml, lib/main.dart, and android/."
              )

          minimum_depth = min(len(item.relative_to(extract_dir).parts) for item in pubspecs)
          nearest = [
              item for item in pubspecs
              if len(item.relative_to(extract_dir).parts) == minimum_depth
          ]
          if len(nearest) != 1:
              options = "\n".join(str(item.relative_to(extract_dir)) for item in nearest)
              raise SystemExit(f"ERROR: Multiple Flutter projects were found at the same level:\n{options}")

          project_dir = nearest[0].parent.resolve()
          print(f"Flutter project root: {project_dir}")

          with output_file.open("a", encoding="utf-8") as stream:
              stream.write(f"zip={selected}\n")
              stream.write(f"zip_name={selected.name}\n")
              stream.write(f"dir={project_dir}\n")

          (Path(os.environ["LOG_DIR"]) / "selected-source.txt").write_text(
              f"zip={selected}\nproject={project_dir}\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          set -Eu
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            sdkmanager_bin="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "sdkmanager was not found; continuing with preinstalled Android SDK packages." \
              | tee "$LOG_DIR/android-licenses.log"
          else
            set +e
            yes | "$sdkmanager_bin" --licenses \
              > "$LOG_DIR/android-licenses.log" 2>&1
            license_status=${PIPESTATUS[1]}
            set -e
            if [[ "$license_status" -ne 0 ]]; then
              echo "Android license command exited with status $license_status." \
                | tee -a "$LOG_DIR/android-licenses.log"
            fi
          fi

      - name: Record toolchain information
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          set -Eeuo pipefail
          {
            flutter --version
            echo
            dart --version
            echo
            java -version
          } 2>&1 | tee "$LOG_DIR/toolchain.txt"

      - name: Configure Android signing
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail

          values=("$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS")
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          if [[ "$present" -eq 0 ]]; then
            echo "No release keystore secrets were provided; the project signing fallback will be used." \
              | tee "$LOG_DIR/signing.txt"
            exit 0
          fi

          if [[ "$present" -ne 4 ]]; then
            echo "ERROR: Android signing secrets are incomplete. Define all four secrets:" \
              | tee "$LOG_DIR/signing.txt"
            echo "ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS" \
              | tee -a "$LOG_DIR/signing.txt"
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/pulse-arena-release.jks
          keytool -list -keystore android/app/pulse-arena-release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=pulse-arena-release.jks
          EOF

          echo "Release keystore restored and validated." | tee "$LOG_DIR/signing.txt"

      - name: Synchronize Android toolchain with Flutter stable
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          set -Eeuo pipefail

          temp_seed="$(mktemp -d)"
          trap 'rm -rf "$temp_seed"' EXIT

          echo "Generating an Android seed from the installed Flutter stable SDK." \
            | tee "$LOG_DIR/android-wrapper.log"
          flutter create --platforms=android --android-language kotlin \
            --project-name pulse_arena "$temp_seed/wrapper_seed" \
            2>&1 | tee -a "$LOG_DIR/android-wrapper.log"

          seed_android="$temp_seed/wrapper_seed/android"
          mkdir -p android/gradle/wrapper
          cp "$seed_android/gradlew" android/gradlew
          cp "$seed_android/gradlew.bat" android/gradlew.bat
          cp "$seed_android/gradle/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/gradle-wrapper.jar
          cp "$seed_android/gradle/wrapper/gradle-wrapper.properties" \
            android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

          SEED_ANDROID="$seed_android" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project_settings = Path("android/settings.gradle.kts")
          seed_settings = Path(os.environ["SEED_ANDROID"]) / "settings.gradle.kts"
          if not project_settings.is_file() or not seed_settings.is_file():
              raise SystemExit("ERROR: Kotlin Gradle settings file was not found.")

          project_text = project_settings.read_text(encoding="utf-8")
          seed_text = seed_settings.read_text(encoding="utf-8")

          plugin_ids = ("com.android.application", "org.jetbrains.kotlin.android")
          selected_versions = {}
          for plugin_id in plugin_ids:
              pattern = rf'id\("{re.escape(plugin_id)}"\)\s+version\s+"([^"]+)"'
              match = re.search(pattern, seed_text)
              if not match:
                  raise SystemExit(f"ERROR: {plugin_id} version was not found in Flutter template.")
              selected_versions[plugin_id] = match.group(1)
              project_text, count = re.subn(
                  pattern,
                  f'id("{plugin_id}") version "{match.group(1)}"',
                  project_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"ERROR: Could not update {plugin_id} in project settings.")

          project_settings.write_text(project_text, encoding="utf-8")

          project_properties = Path("android/gradle.properties")
          seed_properties = Path(os.environ["SEED_ANDROID"]) / "gradle.properties"
          project_lines = project_properties.read_text(encoding="utf-8").splitlines()
          seed_lines = seed_properties.read_text(encoding="utf-8").splitlines()
          managed_keys = ("android.newDsl", "android.builtInKotlin")
          seed_values = {}
          for line in seed_lines:
              stripped = line.strip()
              for key in managed_keys:
                  if stripped.startswith(f"{key}="):
                      seed_values[key] = stripped

          project_lines = [
              line for line in project_lines
              if not any(line.strip().startswith(f"{key}=") for key in managed_keys)
          ]
          for key in managed_keys:
              if key in seed_values:
                  project_lines.append(seed_values[key])
          project_properties.write_text("\n".join(project_lines) + "\n", encoding="utf-8")

          print("Synchronized plugin versions:")
          for plugin_id, version in selected_versions.items():
              print(f"- {plugin_id}: {version}")
          for key in managed_keys:
              print(f"- {seed_values.get(key, key + '=not-defined-by-template')}")
          PY

          {
            echo
            echo "Pinned wrapper configuration from Flutter stable template:"
            cat android/gradle/wrapper/gradle-wrapper.properties
            echo
            echo "Project plugin configuration after synchronization:"
            grep -E 'com.android.application|org.jetbrains.kotlin.android' \
              android/settings.gradle.kts
          } | tee -a "$LOG_DIR/android-wrapper.log"

          ./android/gradlew --version 2>&1 | tee -a "$LOG_DIR/android-wrapper.log"

      - name: Detect build flavor
        id: config
        working-directory: ${{ steps.source.outputs.dir }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' 2>&1 | tee "$LOG_DIR/flavor-detection.log"
          import os
          import re
          from pathlib import Path

          files = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          text = ""
          used_file = None
          for file in files:
              if file.is_file():
                  text = file.read_text(encoding="utf-8", errors="replace")
                  used_file = file
                  break

          flavors = []
          if text:
              block_start = re.search(r"productFlavors\s*\{", text)
              if block_start:
                  index = block_start.end()
                  depth = 1
                  while index < len(text) and depth:
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                      index += 1

                  if depth != 0:
                      raise SystemExit("ERROR: productFlavors block is not balanced in Gradle file.")

                  block = text[block_start.end():index - 1]
                  for match in re.finditer(r"create\s*\(\s*[\"']([^\"']+)[\"']\s*\)", block):
                      flavor = match.group(1)
                      if flavor not in flavors:
                          flavors.append(flavor)

                  for match in re.finditer(r"(?m)^\s*([A-Za-z_][A-Za-z0-9_]*)\s*\{", block):
                      flavor = match.group(1)
                      if flavor not in {"productFlavors", "create"} and flavor not in flavors:
                          flavors.append(flavor)

          preference = ["bazaar", "production", "prod", "release", "myket"]
          selected = next((item for item in preference if item in flavors), None)
          if selected is None and flavors:
              selected = flavors[0]
          if selected is None:
              selected = ""

          print(f"Gradle file: {used_file or 'not found'}")
          print(f"Detected flavors: {flavors or 'none'}")
          print(f"Selected flavor: {selected or 'default (no flavor)'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"flavor={selected}\n")
          PY

      - name: Validate project and build one release APK
        id: build
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          BUILD_FLAVOR: ${{ steps.config.outputs.flavor }}
        run: |
          set -Eeuo pipefail

          run_logged() {
            local log_name="$1"
            shift
            echo "> $*" | tee -a "$LOG_DIR/pipeline.log"
            "$@" 2>&1 | tee "$LOG_DIR/${log_name}.log"
          }

          flutter clean 2>&1 | tee "$LOG_DIR/flutter-clean.log"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          run_logged pub-get flutter pub get
          run_logged analyze flutter analyze --no-fatal-infos

          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            run_logged test flutter test
          else
            echo "No Flutter test files were found; test step skipped." | tee "$LOG_DIR/test.log"
          fi

          build_args=(apk --release)
          if [[ -n "$BUILD_FLAVOR" ]]; then
            build_args+=(--flavor "$BUILD_FLAVOR")
          fi

          echo "> flutter build ${build_args[*]}" | tee -a "$LOG_DIR/pipeline.log"
          if ! flutter build "${build_args[@]}" 2>&1 | tee "$LOG_DIR/build-release.log"; then
            echo "Release build failed. Running one verbose diagnostic build..." \
              | tee -a "$LOG_DIR/build-release.log"
            flutter build "${build_args[@]}" --verbose \
              2>&1 | tee "$LOG_DIR/build-release-verbose.log" || true
            exit 1
          fi

          mapfile -t apk_files < <(
            find build/app/outputs/flutter-apk -maxdepth 1 -type f \
              -name '*release.apk' ! -name '*unsigned*' -print | sort
          )

          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            printf 'ERROR: Expected exactly one release APK, found %s:\n' "${#apk_files[@]}" \
              | tee "$LOG_DIR/apk-discovery.log"
            printf '%s\n' "${apk_files[@]:-none}" | tee -a "$LOG_DIR/apk-discovery.log"
            exit 1
          fi

          version_value="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml)"
          version_name="${version_value%%+*}"
          if [[ "$version_value" == *+* ]]; then
            version_code="${version_value#*+}"
          else
            version_code="0"
          fi
          safe_version="$(printf '%s' "$version_name" | tr -cs 'A-Za-z0-9._-' '-')"
          safe_code="$(printf '%s' "$version_code" | tr -cs 'A-Za-z0-9._-' '-')"
          output_name="PULSE-ARENA-v${safe_version}-build${safe_code}.apk"
          output_path="$OUTPUT_DIR/$output_name"

          cp "${apk_files[0]}" "$output_path"
          sha256sum "$output_path" | tee "$LOG_DIR/apk-sha256.txt"
          ls -lh "$output_path" | tee "$LOG_DIR/apk-file.txt"

          {
            echo "apk_path=$output_path"
            echo "apk_name=$output_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-ARENA-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write successful build summary
        if: success()
        run: |
          {
            echo "## PULSE ARENA build completed"
            echo
            echo "- Source ZIP: \`${{ steps.source.outputs.zip_name }}\`"
            flavor="${{ steps.config.outputs.flavor }}"
            [[ -n "$flavor" ]] || flavor="default"
            echo "- Flavor: \`$flavor\`"
            echo "- APK: \`${{ steps.build.outputs.apk_name }}\`"
            echo "- Artifact: \`PULSE-ARENA-APK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics
        if: failure()
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
          SELECTED_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          set +e
          mkdir -p "$LOG_DIR"

          {
            echo "Failure diagnostics collected at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "selected_zip=${SELECTED_ZIP:-not-selected}"
            echo "project_dir=${PROJECT_DIR:-not-detected}"
          } > "$LOG_DIR/failure-summary.txt"

          flutter doctor -v > "$LOG_DIR/flutter-doctor.txt" 2>&1 || true
          flutter --version > "$LOG_DIR/flutter-version.txt" 2>&1 || true
          dart --version > "$LOG_DIR/dart-version.txt" 2>&1 || true
          java -version > "$LOG_DIR/java-version.txt" 2>&1 || true
          df -h > "$LOG_DIR/disk-space.txt" 2>&1 || true
          free -h > "$LOG_DIR/memory.txt" 2>&1 || true
          git status --short > "$LOG_DIR/git-status.txt" 2>&1 || true

          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR" ]]; then
            cd "$PROJECT_DIR" || true
            find . -maxdepth 5 -type f \
              ! -path './.dart_tool/*' \
              ! -path './build/*' \
              ! -name '*.jks' \
              ! -name '*.keystore' \
              ! -name 'key.properties' \
              -printf '%p\n' | sort > "$LOG_DIR/project-files.txt" 2>&1 || true

            find build -maxdepth 7 -type f -printf '%p %s bytes\n' \
              > "$LOG_DIR/build-files.txt" 2>&1 || true

            ./android/gradlew --version > "$LOG_DIR/gradle-version.txt" 2>&1 || true

            cp pubspec.yaml "$LOG_DIR/pubspec.yaml" 2>/dev/null || true
            cp pubspec.lock "$LOG_DIR/pubspec.lock" 2>/dev/null || true
            cp analysis_options.yaml "$LOG_DIR/analysis_options.yaml" 2>/dev/null || true
            cp android/app/build.gradle "$LOG_DIR/app-build.gradle" 2>/dev/null || true
            cp android/app/build.gradle.kts "$LOG_DIR/app-build.gradle.kts" 2>/dev/null || true
            cp android/build.gradle "$LOG_DIR/android-build.gradle" 2>/dev/null || true
            cp android/build.gradle.kts "$LOG_DIR/android-build.gradle.kts" 2>/dev/null || true
            cp android/settings.gradle "$LOG_DIR/settings.gradle" 2>/dev/null || true
            cp android/settings.gradle.kts "$LOG_DIR/settings.gradle.kts" 2>/dev/null || true
          fi

          find "$LOG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort \
            > "$LOG_DIR/log-manifest.txt" 2>&1 || true

          {
            echo "## PULSE ARENA build failed"
            echo
            echo "A complete diagnostic Artifact named \`PULSE-ARENA-failure-logs-${GITHUB_RUN_NUMBER}\` was generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-ARENA-failure-logs-${{ github.run_number }}
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
