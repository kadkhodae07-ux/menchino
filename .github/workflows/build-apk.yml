name: Build PULSE ARENA APK - WF14

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: pulse-arena-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.8"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  WORKFLOW_REVISION: "WF14"

jobs:
  build-android:
    name: Build Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostics
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
          OUTPUT_DIR: ${{ runner.temp }}/pulse-arena-output
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUTPUT_DIR"
          {
            echo "workflow_revision=$WORKFLOW_REVISION"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "started_at=$(date -u +%FT%TZ)"
          } > "$LOG_DIR/run-info.txt"

      - name: Resolve Flutter source (ZIP or extracted project)
        id: source
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' 2>&1 | tee "$LOG_DIR/select-and-extract.log"
          import os
          import re
          import shutil
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_base = Path(os.environ["RUNNER_TEMP"]) / "pulse-arena-source"
          output_file = Path(os.environ["GITHUB_OUTPUT"])
          log_dir = Path(os.environ["LOG_DIR"])

          def git_list(*patterns: str) -> list[Path]:
              command = ["git", "ls-files", "-z", "--", *patterns]
              result = subprocess.run(
                  command,
                  cwd=workspace,
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return [
                  (workspace / raw.decode("utf-8", errors="surrogateescape")).resolve()
                  for raw in result.stdout.split(b"\0")
                  if raw
              ]

          def commit_time(path: Path) -> int:
              try:
                  rel = str(path.relative_to(workspace))
              except ValueError:
                  return int(path.stat().st_mtime)
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", rel],
                  cwd=workspace,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              value = result.stdout.strip()
              return int(value) if value.isdigit() else int(path.stat().st_mtime)

          def natural_numbers(name: str) -> tuple[int, ...]:
              return tuple(int(value) for value in re.findall(r"\d+", name))

          def clean_archive_names(names: list[str]) -> set[str]:
              clean: set[str] = set()
              for raw in names:
                  normalized = raw.replace("\\", "/").lstrip("/")
                  if not normalized or normalized.endswith("/"):
                      continue
                  parts = PurePosixPath(normalized).parts
                  if any(part in ("", ".", "..") for part in parts):
                      continue
                  clean.add("/".join(parts))
              return clean

          def valid_archive_project_root(names: list[str]) -> str | None:
              clean = clean_archive_names(names)
              roots: list[str] = []
              for item in clean:
                  if item == "pubspec.yaml":
                      root = ""
                  elif item.endswith("/pubspec.yaml"):
                      root = item[: -len("/pubspec.yaml")]
                  else:
                      continue
                  prefix = f"{root}/" if root else ""
                  main = prefix + "lib/main.dart"
                  gradle_files = {
                      prefix + "android/app/build.gradle",
                      prefix + "android/app/build.gradle.kts",
                  }
                  if main in clean and clean.intersection(gradle_files):
                      roots.append(root)
              if not roots:
                  return None
              return sorted(roots, key=lambda value: (value.count("/"), len(value), value))[0]

          def valid_directory_root(root: Path) -> bool:
              return (
                  (root / "pubspec.yaml").is_file()
                  and (root / "lib/main.dart").is_file()
                  and (
                      (root / "android/app/build.gradle").is_file()
                      or (root / "android/app/build.gradle.kts").is_file()
                  )
              )

          def safe_extract(archive_path: Path, destination_root: Path) -> None:
              with zipfile.ZipFile(archive_path) as archive:
                  for member in archive.infolist():
                      normalized = member.filename.replace("\\", "/").lstrip("/")
                      parts = PurePosixPath(normalized).parts
                      if not normalized or any(part in ("", ".", "..") for part in parts):
                          if normalized:
                              print(f"SKIP unsafe member: {member.filename}")
                          continue
                      mode = member.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"ERROR: Symbolic links are not allowed in source ZIP: {member.filename}")
                      destination = (destination_root / Path(*parts)).resolve()
                      if destination_root not in destination.parents and destination != destination_root:
                          raise SystemExit(f"ERROR: Unsafe ZIP member: {member.filename}")
                      if member.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with archive.open(member) as source, destination.open("wb") as target:
                              shutil.copyfileobj(source, target)

          rejected_tokens = (
              "failure-log", "failure_log", "diagnostic", "keystore",
              "license", "unity_lic", "apk-output", "aab-output",
          )
          candidates: list[tuple[int, tuple[int, ...], int, str, str, Path, str]] = []

          zip_paths = set(git_list("*.zip", "**/*.zip"))
          zip_paths.update(path.resolve() for path in workspace.rglob("*.zip") if ".git" not in path.parts)
          for path in sorted(zip_paths):
              if not path.is_file():
                  continue
              lower = path.name.lower()
              relative = str(path.relative_to(workspace))
              if any(token in lower for token in rejected_tokens):
                  print(f"REJECT name: {relative}")
                  continue
              try:
                  if not zipfile.is_zipfile(path):
                      print(f"REJECT invalid ZIP or Git LFS pointer: {relative}")
                      continue
                  with zipfile.ZipFile(path) as archive:
                      internal_root = valid_archive_project_root(archive.namelist())
                  if internal_root is None:
                      print(f"REJECT not Flutter Android source: {relative}")
                      continue
                  candidates.append((
                      commit_time(path),
                      natural_numbers(path.name),
                      1,
                      relative.lower(),
                      "zip",
                      path,
                      internal_root,
                  ))
                  print(f"VALID ZIP: {relative} | root={internal_root or '.'}")
              except Exception as error:
                  print(f"REJECT unreadable ZIP: {relative} | {error}")

          pubspec_paths = set(git_list("pubspec.yaml", "**/pubspec.yaml"))
          pubspec_paths.update(
              path.resolve()
              for path in workspace.rglob("pubspec.yaml")
              if not any(part in {".git", ".dart_tool", "build"} for part in path.parts)
          )
          seen_directories: set[Path] = set()
          for pubspec in sorted(pubspec_paths):
              root = pubspec.parent.resolve()
              if root in seen_directories or not valid_directory_root(root):
                  continue
              seen_directories.add(root)
              relative = "." if root == workspace else str(root.relative_to(workspace))
              times = [
                  commit_time(pubspec),
                  commit_time(root / "lib/main.dart"),
              ]
              gradle = root / "android/app/build.gradle.kts"
              if not gradle.is_file():
                  gradle = root / "android/app/build.gradle"
              times.append(commit_time(gradle))
              candidates.append((
                  max(times),
                  natural_numbers(relative),
                  0,
                  relative.lower(),
                  "directory",
                  root,
                  "",
              ))
              print(f"VALID DIRECTORY: {relative}")

          if not candidates:
              tracked = subprocess.run(
                  ["git", "ls-files"],
                  cwd=workspace,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              ).stdout
              (log_dir / "repository-files.txt").write_text(tracked, encoding="utf-8")
              raise SystemExit(
                  "ERROR: No valid Flutter Android source was found. "
                  "Upload a source ZIP or commit the extracted Flutter project. "
                  "Required: pubspec.yaml, lib/main.dart and android/app/build.gradle(.kts)."
              )

          candidates.sort(key=lambda item: item[:4])
          _, _, _, reference_key, source_kind, selected, internal_root = candidates[-1]
          source_ref = str(selected.relative_to(workspace)) if selected != workspace else "."
          print(f"SELECTED {source_kind.upper()}: {source_ref}")

          shutil.rmtree(extract_base, ignore_errors=True)
          extract_base.mkdir(parents=True, exist_ok=True)

          if source_kind == "zip":
              safe_extract(selected, extract_base)
              project_dir = (extract_base / internal_root).resolve() if internal_root else extract_base.resolve()
              selected_zip = str(selected)
          else:
              shutil.rmtree(extract_base, ignore_errors=True)
              shutil.copytree(
                  selected,
                  extract_base,
                  ignore=shutil.ignore_patterns(
                      ".git", ".dart_tool", "build", ".gradle", ".idea",
                      "*.iml", "*.apk", "*.aab",
                  ),
              )
              project_dir = extract_base.resolve()
              selected_zip = ""

          required_paths = [
              project_dir / "pubspec.yaml",
              project_dir / "lib/main.dart",
              project_dir / "android/app",
          ]
          for required in required_paths:
              if not required.exists():
                  raise SystemExit(f"ERROR: Resolved project is incomplete: {required}")

          with output_file.open("a", encoding="utf-8") as handle:
              handle.write(f"source_kind={source_kind}\n")
              handle.write(f"source_ref={source_ref}\n")
              handle.write(f"zip={selected_zip}\n")
              handle.write(f"dir={project_dir}\n")

          (log_dir / "selected-source.txt").write_text(
              f"kind={source_kind}\nsource={source_ref}\nproject={project_dir}\n",
              encoding="utf-8",
          )
          print(f"PROJECT_DIR: {project_dir}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Validate project configuration
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' 2>&1 | tee "$LOG_DIR/android-config-validation.log"
          import re
          from pathlib import Path

          required_files = [
              Path("pubspec.yaml"),
              Path("lib/main.dart"),
              Path("android/app/build.gradle.kts"),
              Path("android/settings.gradle.kts"),
              Path("android/app/src/main/AndroidManifest.xml"),
          ]
          missing = [str(path) for path in required_files if not path.is_file()]
          if missing:
              raise SystemExit("ERROR: Required project files are missing: " + ", ".join(missing))

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          app = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          settings = Path("android/settings.gradle.kts").read_text(encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")

          version_match = re.search(
              r"(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$",
              pubspec,
          )
          app_id_match = re.search(r'applicationId\s*=\s*"([^"]+)"', app)
          namespace_match = re.search(r'namespace\s*=\s*"([^"]+)"', app)

          checks = {
              "valid Flutter semantic version and build number": version_match is not None,
              "valid Android applicationId": app_id_match is not None,
              "valid Android namespace": namespace_match is not None,
              "Bazaar product flavor": 'create("bazaar")' in app,
              "Myket product flavor": 'create("myket")' in app,
              "release build type": "release {" in app,
              "Java 17 source compatibility": "JavaVersion.VERSION_17" in app,
              "Flutter Gradle plugin": "dev.flutter.flutter-gradle-plugin" in app,
              "Android application plugin": "com.android.application" in settings,
              "Kotlin Android plugin": "org.jetbrains.kotlin.android" in settings,
              "launcher activity is declared": "MainActivity" in manifest,
          }
          failed = [name for name, okay in checks.items() if not okay]
          for name, okay in checks.items():
              print(f"{'OK' if okay else 'FAIL'}: {name}")

          if version_match:
              print(f"APP_VERSION: {version_match.group(1)}+{version_match.group(2)}")
          if app_id_match:
              print(f"APPLICATION_ID: {app_id_match.group(1)}")
          if namespace_match:
              print(f"NAMESPACE: {namespace_match.group(1)}")

          if failed:
              raise SystemExit("ERROR: Invalid project configuration: " + ", ".join(failed))
          PY

          if [[ -f tool/validate_release.py ]]; then
            python3 tool/validate_release.py 2>&1 | tee "$LOG_DIR/release-readiness-validation.log"
          else
            echo "No tool/validate_release.py file found; custom release validation skipped." \
              | tee "$LOG_DIR/release-readiness-validation.log"
          fi

      - name: Resolve release metadata
        id: meta
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "ERROR: Invalid pubspec version: $version" | tee "$LOG_DIR/release-metadata.txt"
            exit 1
          fi

          safe_version="$(printf '%s' "$version" | tr '+/' '__' | tr -cd 'A-Za-z0-9._-')"
          application_id="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"
          namespace="$(sed -nE 's/^[[:space:]]*namespace[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -1)"

          {
            echo "workflow_revision=$WORKFLOW_REVISION"
            echo "version=$version"
            echo "safe_version=$safe_version"
            echo "application_id=$application_id"
            echo "namespace=$namespace"
            echo "source=${{ steps.source.outputs.source_ref }}"
          } | tee "$LOG_DIR/release-metadata.txt"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "safe_version=$safe_version" >> "$GITHUB_OUTPUT"
          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=PULSE-ARENA-APKS-WF14-$safe_version" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK and Gradle wrapper
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail

          flutter_bin="$(command -v flutter)"
          flutter_sdk="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" ]]; then
            echo "ERROR: Android SDK path is unavailable." | tee "$LOG_DIR/android-wrapper.log"
            exit 1
          fi

          cat > android/local.properties <<EOF
          sdk.dir=$android_sdk
          flutter.sdk=$flutter_sdk
          EOF

          seed_dir="$(mktemp -d)"
          trap 'rm -rf "$seed_dir"' EXIT
          printf 'rootProject.name = "pulse_wrapper_seed"\n' > "$seed_dir/settings.gradle.kts"

          {
            echo "Generating Gradle ${GRADLE_VERSION} wrapper with setup-gradle."
            (cd "$seed_dir" && gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin \
              --no-daemon)
            mkdir -p android/gradle/wrapper
            cp "$seed_dir/gradlew" android/gradlew
            cp "$seed_dir/gradlew.bat" android/gradlew.bat
            cp "$seed_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp "$seed_dir/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            echo
            echo "Wrapper configuration:"
            cat android/gradle/wrapper/gradle-wrapper.properties
            echo
            (cd android && ./gradlew --version --no-daemon)
          } 2>&1 | tee "$LOG_DIR/android-wrapper.log"

      - name: Configure release signing
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          values=("$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS")
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done

          rm -f android/key.properties android/app/pulse-arena-release.jks

          if [[ "$present" -eq 0 ]]; then
            echo "No release signing Secrets found; debug signing fallback will be used." \
              | tee "$LOG_DIR/signing.txt"
            exit 0
          fi

          if [[ "$present" -ne 4 ]]; then
            echo "ERROR: Release signing Secrets are incomplete." | tee "$LOG_DIR/signing.txt"
            echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS" \
              | tee -a "$LOG_DIR/signing.txt"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/pulse-arena-release.jks
          keytool -list \
            -keystore android/app/pulse-arena-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=pulse-arena-release.jks
          EOF
          echo "Release keystore restored and validated." | tee "$LOG_DIR/signing.txt"

      - name: Flutter dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          flutter --version 2>&1 | tee "$LOG_DIR/flutter-version.txt"
          dart --version 2>&1 | tee "$LOG_DIR/dart-version.txt"
          java -version 2>&1 | tee "$LOG_DIR/java-version.txt"
          flutter doctor -v > "$LOG_DIR/flutter-doctor.txt" 2>&1 || true
          flutter clean 2>&1 | tee "$LOG_DIR/flutter-clean.log"
          flutter pub get 2>&1 | tee "$LOG_DIR/pub-get.log"

      - name: Dart format
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          dart format lib test 2>&1 | tee "$LOG_DIR/dart-format.log"

      - name: Static analysis
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee "$LOG_DIR/analyze.log"

      - name: Tests
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set -Eeuo pipefail
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test 2>&1 | tee "$LOG_DIR/test.log"
          else
            echo "No Dart test files were found; test stage skipped." | tee "$LOG_DIR/test.log"
          fi

      - name: Build and verify Bazaar and Myket release APKs
        id: build
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
          OUTPUT_DIR: ${{ runner.temp }}/pulse-arena-output
          SAFE_VERSION: ${{ steps.meta.outputs.safe_version }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APPLICATION_ID: ${{ steps.meta.outputs.application_id }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          build_tools_dir=""
          if [[ -n "${ANDROID_SDK_ROOT:-}" && -d "$ANDROID_SDK_ROOT/build-tools" ]]; then
            build_tools_dir="$(find "$ANDROID_SDK_ROOT/build-tools" \
              -mindepth 1 -maxdepth 1 -type d -printf '%f %p\n' \
              | sort -V | tail -1 | cut -d' ' -f2-)"
          fi
          apksigner_bin="${build_tools_dir:+$build_tools_dir/apksigner}"
          zipalign_bin="${build_tools_dir:+$build_tools_dir/zipalign}"

          verify_apk() {
            local apk="$1"
            local label="$2"
            local file_size
            file_size="$(stat -c '%s' "$apk")"

            if (( file_size < 1000000 )); then
              echo "ERROR: ${label} APK is unexpectedly small (${file_size} bytes)."
              return 1
            fi

            local entry_log="$LOG_DIR/apk-entries-${label,,}.txt"
            unzip -tq "$apk" >/dev/null
            unzip -Z1 "$apk" > "$entry_log"
            grep -Fxq 'AndroidManifest.xml' "$entry_log"
            grep -Fxq 'classes.dex' "$entry_log"
            grep -Eq '^lib/.+/libapp\.so$' "$entry_log"

            if [[ -x "$apksigner_bin" ]]; then
              "$apksigner_bin" verify --verbose "$apk" \
                > "$LOG_DIR/apksigner-${label,,}.txt" 2>&1
            else
              echo "apksigner was not found; signature verification tool step skipped." \
                > "$LOG_DIR/apksigner-${label,,}.txt"
            fi

            if [[ -x "$zipalign_bin" ]]; then
              "$zipalign_bin" -c -P 16 4 "$apk" \
                > "$LOG_DIR/zipalign-${label,,}.txt" 2>&1
            else
              echo "zipalign was not found; alignment verification tool step skipped." \
                > "$LOG_DIR/zipalign-${label,,}.txt"
            fi
          }

          build_flavor() {
            local flavor="$1"
            local label="$2"
            local log="$LOG_DIR/build-${flavor}-release.log"

            echo "flutter build apk --release --flavor ${flavor} --no-pub" \
              | tee -a "$LOG_DIR/pipeline.log"
            if ! flutter build apk \
              --release \
              --flavor "$flavor" \
              --no-pub \
              --dart-define="STORE_CHANNEL=$flavor" \
              2>&1 | tee "$log"; then
              echo "${label} build failed; collecting verbose diagnostics." | tee -a "$log"
              flutter build apk \
                --release \
                --flavor "$flavor" \
                --no-pub \
                --dart-define="STORE_CHANNEL=$flavor" \
                -v > "$LOG_DIR/build-${flavor}-release-verbose.log" 2>&1 || true
              return 1
            fi

            local apk_path="build/app/outputs/flutter-apk/app-${flavor}-release.apk"
            if [[ ! -f "$apk_path" ]]; then
              apk_path="$(find build/app/outputs -type f \
                -name "*${flavor}*release*.apk" -printf '%T@ %p\n' \
                | sort -n | tail -1 | cut -d' ' -f2-)"
            fi
            if [[ -z "$apk_path" || ! -f "$apk_path" ]]; then
              echo "ERROR: ${label} build finished but its APK was not found." | tee -a "$log"
              return 1
            fi

            local output="$OUTPUT_DIR/PULSE-ARENA-${label}-${SAFE_VERSION}.apk"
            cp "$apk_path" "$output"
            verify_apk "$output" "$label"
            ls -lh "$output" | tee -a "$LOG_DIR/apk-output.txt"
          }

          build_flavor bazaar Bazaar
          build_flavor myket Myket

          (
            cd "$OUTPUT_DIR"
            sha256sum *.apk > SHA256SUMS.txt
            {
              echo "PULSE ARENA Android release"
              echo "Workflow: $WORKFLOW_REVISION"
              echo "Version: $APP_VERSION"
              echo "Application ID: $APPLICATION_ID"
              echo "Generated: $(date -u +%FT%TZ)"
              echo
              echo "Files:"
              find . -maxdepth 1 -type f -name '*.apk' -printf '%f | %s bytes\n' | sort
            } > BUILD_MANIFEST.txt
          )

          cp "$OUTPUT_DIR/SHA256SUMS.txt" "$LOG_DIR/apk-sha256.txt"
          cp "$OUTPUT_DIR/BUILD_MANIFEST.txt" "$LOG_DIR/build-manifest.txt"
          cat "$LOG_DIR/build-manifest.txt"
          cat "$LOG_DIR/apk-sha256.txt"
          echo "dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Remove previous PULSE ARENA artifacts
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('PULSE-ARENA-')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Bazaar and Myket APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.build.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          include-hidden-files: false

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
          SELECTED_ZIP: ${{ steps.source.outputs.zip }}
          SELECTED_SOURCE: ${{ steps.source.outputs.source_ref }}
          SOURCE_KIND: ${{ steps.source.outputs.source_kind }}
          LOG_DIR: ${{ runner.temp }}/pulse-arena-logs
        run: |
          set +e
          mkdir -p "$LOG_DIR"
          {
            echo "workflow_revision=$WORKFLOW_REVISION"
            echo "failure_time=$(date -u +%FT%TZ)"
            echo "source_kind=$SOURCE_KIND"
            echo "selected_source=$SELECTED_SOURCE"
            echo "selected_zip=$SELECTED_ZIP"
            echo "project_dir=$PROJECT_DIR"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          } > "$LOG_DIR/failure-summary.txt"

          flutter --version > "$LOG_DIR/flutter-version-final.txt" 2>&1 || true
          dart --version > "$LOG_DIR/dart-version-final.txt" 2>&1 || true
          java -version > "$LOG_DIR/java-version-final.txt" 2>&1 || true
          gradle --version > "$LOG_DIR/gradle-system-version.txt" 2>&1 || true
          df -h > "$LOG_DIR/disk-space.txt" 2>&1 || true
          free -h > "$LOG_DIR/memory.txt" 2>&1 || true

          if [[ -n "$PROJECT_DIR" && -d "$PROJECT_DIR" ]]; then
            cd "$PROJECT_DIR" || true
            cp pubspec.yaml "$LOG_DIR/pubspec.yaml" 2>/dev/null || true
            cp pubspec.lock "$LOG_DIR/pubspec.lock" 2>/dev/null || true
            cp analysis_options.yaml "$LOG_DIR/analysis_options.yaml" 2>/dev/null || true
            cp android/settings.gradle.kts "$LOG_DIR/settings.gradle.kts" 2>/dev/null || true
            cp android/build.gradle.kts "$LOG_DIR/android-build.gradle.kts" 2>/dev/null || true
            cp android/app/build.gradle.kts "$LOG_DIR/app-build.gradle.kts" 2>/dev/null || true
            cp android/gradle/wrapper/gradle-wrapper.properties "$LOG_DIR/gradle-wrapper.properties" 2>/dev/null || true
            cp android/app/proguard-rules.pro "$LOG_DIR/proguard-rules.pro" 2>/dev/null || true
            find build -type f \( \
              -name 'missing_rules.txt' -o \
              -name 'mapping.txt' -o \
              -name 'usage.txt' -o \
              -name 'seeds.txt' -o \
              -name '*.xml' \
            \) -maxdepth 12 -print 2>/dev/null > "$LOG_DIR/build-diagnostic-files.txt" || true
            while IFS= read -r file; do
              [[ -f "$file" ]] || continue
              target="$LOG_DIR/build-files/${file#./}"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target" 2>/dev/null || true
            done < "$LOG_DIR/build-diagnostic-files.txt"
            find . -maxdepth 5 -type f -printf '%p %s bytes\n' \
              | sort > "$LOG_DIR/project-files.txt" 2>/dev/null || true
          fi

          find "$LOG_DIR" -type f -printf '%P %s bytes\n' \
            | sort > "$LOG_DIR/log-manifest.txt" 2>/dev/null || true

      - name: Remove previous failure-log artifacts
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('PULSE-ARENA-failure-logs-')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-ARENA-failure-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/pulse-arena-logs
          if-no-files-found: warn
          retention-days: 14
