name: Mar O Pele Padshahi - Unity Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MarOPelePadshahi_Unity_Source_*.zip'
      - '.github/workflows/mar-o-pele-padshahi-unity-build.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: mar-o-pele-padshahi-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.75f1
  SOURCE_PATTERN: MarOPelePadshahi_Unity_Source_*.zip
  PROJECT_DIR: unity-project
  RELEASE_DIR: release

jobs:
  android:
    name: Test and build Bazaar/Myket APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete artifacts from older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' | while read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
            done

      - name: Select latest Unity source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "$SOURCE_PATTERN" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$source_zip" ] || [ ! -f "$source_zip" ]; then
            echo "No source ZIP matching $SOURCE_PATTERN was found in repository root." >&2
            exit 1
          fi

          echo "zip=$source_zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$source_zip")" >> "$GITHUB_OUTPUT"
          sha256sum "$source_zip"

      - name: Extract Unity project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR" _source
          mkdir -p _source
          unzip -q "${{ steps.source.outputs.zip }}" -d _source

          version_file="$(find _source -type f -path '*/ProjectSettings/ProjectVersion.txt' -print -quit)"
          if [ -z "$version_file" ]; then
            echo "ProjectSettings/ProjectVersion.txt was not found inside the ZIP." >&2
            exit 1
          fi

          source_project="$(dirname "$(dirname "$version_file")")"
          mv "$source_project" "$PROJECT_DIR"

          test -d "$PROJECT_DIR/Assets"
          test -f "$PROJECT_DIR/Packages/manifest.json"
          test -f "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/Tools/validate_project.py"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: unity-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('unity-project/Packages/manifest.json', 'unity-project/Assets/**/*.cs', 'unity-project/Assets/**/*.asmdef') }}
          restore-keys: |
            unity-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: TestResults

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/menchino-release.jks"
            chmod 600 "$RUNNER_TEMP/menchino-release.jks"
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty; Unity will use its non-custom signing configuration."
          fi

      - name: Build Cafe Bazaar APK
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/menchino-release.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Menchino.RoyalSnakesLadders.Editor.AndroidBuild.BuildApkBatch
          customParameters: -storeTarget Bazaar -outputPath Builds/Android/MarOPelePadshahi-Bazaar.apk

      - name: Build Myket APK
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/menchino-release.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Menchino.RoyalSnakesLadders.Editor.AndroidBuild.BuildApkBatch
          customParameters: -storeTarget Myket -outputPath Builds/Android/MarOPelePadshahi-Myket.apk

      - name: Collect final outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Bazaar.apk" \
             "$RELEASE_DIR/MarOPelePadshahi-v1.0.0-Bazaar.apk"
          cp "$PROJECT_DIR/Builds/Android/MarOPelePadshahi-Myket.apk" \
             "$RELEASE_DIR/MarOPelePadshahi-v1.0.0-Myket.apk"
          cp "${{ steps.source.outputs.zip }}" "$RELEASE_DIR/${{ steps.source.outputs.name }}"

          (
            cd "$RELEASE_DIR"
            sha256sum *.apk *.zip > SHA256SUMS.txt
          )

          cat > "$RELEASE_DIR/build-info.txt" <<EOF
          project=Mar O Pele Padshahi
          unity=${UNITY_VERSION}
          package=mk.kadkhodai.menchino
          source=${{ steps.source.outputs.name }}
          commit=${GITHUB_SHA}
          run=${GITHUB_RUN_NUMBER}
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Upload final source and APKs
        uses: actions/upload-artifact@v4
        with:
          name: MarOPelePadshahi-Unity-Android-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p failure-logs
          cp -r TestResults failure-logs/ 2>/dev/null || true
          cp -r "$PROJECT_DIR/Logs" failure-logs/ 2>/dev/null || true
          cp "$HOME/.local/share/unity3d/Editor.log" failure-logs/Editor.log 2>/dev/null || true
          cp "${{ steps.source.outputs.zip }}" failure-logs/ 2>/dev/null || true
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            \( -name '*.log' -o -name '*.xml' -o -name '*.txt' \) \
            -print > failure-logs/files.txt 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MarOPelePadshahi-failure-logs-${{ github.run_number }}
          path: failure-logs
          if-no-files-found: warn
          retention-days: 7
